<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const GRAVITY = 0.5;
        const SPEED = 1000;
        const PIPE_SPEED = 200;
        const PIPE_GAP = 100;
        const PIPE_WIDTH = 50;
        const PIPE_HEIGHT = 100;
        const BIRD_WIDTH = 50;
        const BIRD_HEIGHT = 50;
        const BIRD_SPEED = 5;
        const SCORE_INCREMENT = 1;

        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        let bird = { x: canvas.width / 2 - BIRD_WIDTH / 2, y: canvas.height / 2 - BIRD_HEIGHT / 2, width: BIRD_WIDTH, height: BIRD_HEIGHT };
        let pipes = [];
        let score = 0;
        let over = false;

        function draw() {
            if (over) {
                if (window.__flappy) {
                    window.__flappy.y = bird.y;
                    window.__flappy.score = score;
                    window.__flappy.over = over;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            pipes.forEach(pipe => {
                ctx.fillStyle = "#fff";
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.height);
                ctx.fillRect(pipe.x, pipe.bottom, PIPE_WIDTH, pipe.height);
            });

            ctx.fillStyle = "#00f";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

            if (!pipes.some(pipe => bird.x + bird.width < pipe.x)) {
                pipes.push({ x: canvas.width + PIPE_GAP, bottom: pipe.bottom });
            }

            pipes.forEach(pipe => {
                if (bird.x > pipe.x + PIPE_WIDTH) {
                    pipe.x -= PIPE_SPEED;
                } else if (bird.x < pipe.x && (bird.y < pipe.bottom && bird.y + bird.height > pipe.y)) {
                    over = true;
                } else {
                    pipe.x -= PIPE_SPEED;
                }
            });

            if (!over) {
                bird.y += BIRD_SPEED;
                if (bird.y + bird.height >= canvas.height) {
                    over = true;
                }
            }
        }

        function handleKeyDown(event) {
            if (!over) {
                if (event.key === " ") {
                    bird.y = 0;
                } else if (event.type === "mousedown" && event.clientX < canvas.width) {
                    bird.y = 0;
                }
            }
        }

        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("mousedown", handleKeyDown);

        setInterval(draw, SPEED);
    </script>
</body>
</html>
