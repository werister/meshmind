<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
body, canvas { margin: 0; display: block; background: #f0f; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let score = 0;
let over = false;
let birdY = 100;
let gravity = 0.5;
let flap = 0;
let pipes = [];
let pipeInterval = setInterval(() => {
  pipes.push({
    x: canvas.width,
    y: Math.floor(Math.random() * 200) + 300,
    width: 80,
    height: 80
  });
}, 100);

let lastInput = null;
let lastTime = performance.now();

function update() {
  if (over) return;

  // Update bird position based on gravity and flap
  birdY += gravity;
  if (lastInput === 'flap' || (lastInput === null && (lastTime - performance.now() < 200))) {
    flap = -8;
    birdY += flap;
  }

  // Move pipes
  pipes.forEach((pipe, i) => {
    pipe.x -= 4;
    if (pipe.x + pipe.width < 0) {
      pipes.shift();
      continue;
    }
    if (birdY + 50 <= pipe.y && pipe.x + pipe.width < canvas.width) {
      over = true;
      return;
    }
    if (pipe.x > 0 && pipe.x + pipe.width > canvas.width) {
      pipes.shift();
      continue;
    }
    if (pipe.x <= 0 && pipe.x + pipe.width > canvas.width) {
      pipes.shift();
      continue;
    }
  });

  // Check collision with ground or ceiling
  if (birdY >= canvas.height - 50) {
    over = true;
  }

  // Score if passing a pipe
  for (let i = 0; i < pipes.length; i++) {
    if (pipes[i].x + pipes[i].width < canvas.width && pipes[i].x > 0) {
      if (birdY + 50 <= pipes[i].y) {
        score++;
      }
    }
  }

  // Update debug object
  window.__flappy = { y: birdY, score: score, over: over };

  lastInput = null;
  lastTime = performance.now();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw pipes
  pipes.forEach(pipe => {
    ctx.fillStyle = '#f9d';
    ctx.fillRect(pipe.x, pipe.y, pipe.width, pipe.height);
  });

  // Draw bird
  ctx.fillStyle = '#fdd';
  ctx.beginPath();
  ctx.arc(canvas.width / 2, birdY, 15, 0, 2 * Math.PI);
  ctx.fill();

  // Draw ground
  ctx.fillStyle = '#ddd';
  ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

  // Draw score
  ctx.fillStyle = '#000';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Score: ${score}`, 10, 30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initial state
let lastInput = null;
let lastTime = performance.now();
let pipes = [];

// Capture input
canvas.addEventListener('mousedown', () => {
  lastInput = 'flap';
});
canvas.addEventListener('click', () => {
  lastInput = 'flap';
});

// Game loop
loop();
</script>
</body>
</html>
