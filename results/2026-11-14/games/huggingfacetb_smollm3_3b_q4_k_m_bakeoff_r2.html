<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin: 0; padding: 0; }
canvas { position: absolute; top: 0; left: 0; width: 400px; height: 600px; }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const birdY = 100;
const birdScore = 0;
const birdOver = false;
const bird = { y: birdY, score: birdScore, over: birdOver };
window.__flappy = bird;

function draw() {
  ctx.clearRect(0, 0, 400, 600);
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, 400, 600);
  ctx.strokeStyle = 'white';
  ctx.strokeRect(0, 0, 400, 600);
  ctx.beginPath();
  ctx.moveTo(200, 0);
  ctx.lineTo(200, 600);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(200, 600);
  ctx.lineTo(0, 300);
  ctx.lineTo(400, 300);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(bird.y, 150, 20, 0, Math.PI * 2, false);
  ctx.fill();
}

function update() {
  bird.y += 0.5;
  if (bird.y > 550) birdOver = true;
}

function handleInput() {
  if (birdOver) return;
  const e = window.event;
  if (e.keyCode === 32) {
    bird.y -= 20;
  }
}

function gameLoop() {
  draw();
  update();
  handleInput();
  requestAnimationFrame(gameLoop);
}

gameLoop();
