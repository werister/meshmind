<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
    body { margin: 0; overflow: hidden; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 1px solid #000; background-color: #70c5ce; }
</style>
</head>
<body>
<canvas id="flappyCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');

    // Game Constants
    const GRAVITY = 0.5;
    const JUMP_STRENGTH = -8;
    const PIPE_SPEED = 3;
    const PIPE_WIDTH = 50;
    const PIPE_GAP = 150;
    const PIPE_SPAWN_RATE = 150; // Frames between pipe spawns

    // Game State
    let birdY;
    let birdVelocity;
    let score = 0;
    let gameRunning = false;
    let pipes = [];
    let frameCount = 0;
    let pipeSpawnTimer = 0;

    // Bird Object
    const bird = {
        x: 50,
        y: canvas.height / 2,
        radius: 15,
        color: 'yellow'
    };

    // Input Handling
    function handleInput(e) {
        if (!gameRunning) {
            if (e.code === 'Space' || e.type === 'click') {
                startGame();
            }
        } else {
            if (e.code === 'Space' || (e.type === 'click' && e.button === 0)) {
                flap();
            }
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            handleInput(e);
        }
        if (e.code === 'KeyR' && !gameRunning) {
            restartGame();
        }
    });

    canvas.addEventListener('click', handleInput);

    function resetGame() {
        bird.y = canvas.height / 2;
        birdVelocity = 0;
        score = 0;
        pipes = [];
        frameCount = 0;
        pipeSpawnTimer = 0;
        gameRunning = false;
        window.__flappy = { y: bird.y, score: score, over: false };
    }

    function startGame() {
        if (!gameRunning) {
            resetGame(); // Ensure reset state is clean before starting
            gameRunning = true;
            window.__flappy.over = false;
        }
    }

    function restartGame() {
        resetGame();
        startGame();
    }

    function flap() {
        if (gameRunning) {
            birdVelocity = JUMP_STRENGTH;
        }
    }

    function updateBird() {
        birdVelocity += GRAVITY;
        bird.y += birdVelocity;

        // Ceiling collision
        if (bird.y - bird.radius < 0) {
            bird.y = bird.radius;
            birdVelocity = 0;
        }

        // Ground collision
        if (bird.y + bird.radius > canvas.height) {
            bird.y = canvas.height - bird.radius;
            birdVelocity = 0;
            gameOver();
            return;
        }
    }

    function spawnPipe() {
        // Random height for the top pipe's bottom edge
        const minHeight = 50;
        const maxHeight = canvas.height - PIPE_GAP - 50;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

        pipes.push({
            x: canvas.width,
            topHeight: topHeight,
            bottomY: topHeight + PIPE_GAP,
            width: PIPE_WIDTH,
            scored: false
        });
    }

    function updatePipes() {
        pipeSpawnTimer++;
        if (pipeSpawnTimer >= PIPE_SPAWN_RATE) {
            spawnPipe();
            pipeSpawnTimer = 0;
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= PIPE_SPEED;

            // Scoring
            if (p.x + p.width < bird.x && !p.scored) {
                score++;
                p.scored = true;
            }

            // Collision Detection
            if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + p.width) {
                // Bird is horizontally aligned with the pipe
                if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY) {
                    gameOver();
                    return;
                }
            }

            // Remove off-screen pipes
            if (p.x + p.width < 0) {
                pipes.splice(i, 1);
            }
        }
    }

    function draw() {
        // Clear canvas
        ctx.fillStyle = '#70c5ce';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Pipes
        ctx.fillStyle = 'green';
        pipes.forEach(p => {
            // Top pipe
            ctx.fillRect(p.x, 0, p.width, p.topHeight);
            // Bottom pipe
            ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
        });

        // Draw Bird
        ctx.fillStyle = bird.color;
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        // Draw Score
        ctx.fillStyle = 'white';
        ctx.font = '30px Arial';
        ctx.fillText('Score: ' + score, 10, 30);

        if (!gameRunning && window.__flappy.over) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px Arial';
            ctx.fillText('Press R or Click to Restart', canvas.width / 2, canvas.height / 2 + 30);
        }
    }

    function gameLoop() {
        if (gameRunning) {
            frameCount++;
            updateBird();
            updatePipes();
            draw();
            window.__flappy.y = bird.y;
            window.__flappy.score = score;
            window.__flappy.over = false;
        } else if (window.__flappy.over) {
            // Game Over screen is drawn in draw()
        }

        window.__flappy.y = bird.y;
        window.__flappy.score = score;
        window.__flappy.over = !gameRunning; // Set over state based on gameRunning
        
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameRunning = false;
        window.__flappy.over = true;
    }

    // Initialize the game state and start the loop
    resetGame();
    gameLoop();

</script>
</body>
</html>
